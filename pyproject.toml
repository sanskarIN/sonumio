[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sonumio"
version = "0.1.0.dev0"
description = "Local-first generative audio platform with explicit model provenance"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Sonumio contributors"}]
dependencies = ["numpy>=1.26,<3", "fastapi>=0.110,<1", "uvicorn>=0.29,<1"]

[project.optional-dependencies]
research = ["torch>=2.2", "transformers>=4.45,<5", "accelerate>=0.26", "safetensors>=0.4"]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
sonumio = "sonumio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
