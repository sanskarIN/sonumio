name: Frozen source probe nuisance robustness (CPU)

on:
  pull_request:
    paths:
      - 'research/probe_nuisance*.py'
      - 'research/open_set_source_probe.py'
      - 'research/generated_source_grounding.py'
      - 'research/latent_audio.py'
      - 'research/generation_audit.py'
      - 'tests/test_probe_nuisance_audit.py'
      - '.github/workflows/probe-nuisance-audit.yml'
  push:
    branches: [main]
    paths:
      - 'research/probe_nuisance*.py'
      - 'tests/test_probe_nuisance_audit.py'
      - '.github/workflows/probe-nuisance-audit.yml'

permissions:
  contents: read

jobs:
  robustness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]' 'scipy>=1.12,<2'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests/test_probe_nuisance_audit.py
      - name: Evaluate frozen probe on fresh paired nuisance and degradation panels
        run: |
          python -m research.probe_nuisance_audit > "$RUNNER_TEMP/nuisance.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "nuisance.json").read_text())
          assert report["fresh_source_recordings"] == 24
          assert report["fresh_noise_recordings"] == 28
          assert len(report["control_results"]) == 12
          assert not report["exact_reference_overlap"]
          assert not report["exact_training_validation_overlap"]
          assert not report["training_or_calibration_changed"]
          assert not report["audio_or_weights_saved"]
          assert not report["model_readiness_established"]
          print("reference gate", report["reference_gate"])
          for name, panel in report["control_results"].items():
              for domain, count in (("source", 24), ("noise", 28)):
                  aggregate = panel[domain]["aggregate"]
                  assert aggregate["cases"] == count
                  assert aggregate["transformed_accepted"] == aggregate["original_accepted"] + aggregate["new_acceptances"] - aggregate["removed_acceptances"]
                  assert sum(t["count"] for t in aggregate["transitions"]) == count
                  print("nuisance", name, domain, json.dumps(aggregate, sort_keys=True))
              print("decision invariance", name, panel["exact_decision_invariance"])
          PY
