name: Private archive exhaustive overlap research (CPU)
on:
  pull_request:
    paths:
      - 'research/archive_overlap_audit.py'
      - 'research/corpus_archive*.py'
      - 'research/audio_dataset.py'
      - 'tests/test_archive_overlap_audit.py'
      - 'tests/test_corpus_archive.py'
      - '.github/workflows/archive-overlap-research.yml'
  push:
    branches: [main]
    paths:
      - 'research/archive_overlap_audit.py'
      - 'research/corpus_archive*.py'
      - 'research/audio_dataset.py'
      - 'tests/test_archive_overlap_audit.py'
      - 'tests/test_corpus_archive.py'
      - '.github/workflows/archive-overlap-research.yml'
permissions:
  contents: read
jobs:
  overlap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -e '.[test]' 'scipy>=1.12,<2'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests/test_archive_overlap_audit.py tests/test_corpus_archive.py
