name: Source-only build gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_version:
        description: Exact numeric version required for the source candidate
        required: true
        type: string

# Superseded PR runs share a group and may cancel one another.
# Main-branch pushes and manual dispatches each get a unique run_id group,
# because even cancel-in-progress: false can evict older pending group runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  archive-smoke:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: '3.11' }
          - { os: ubuntu-24.04, python: '3.13' }
          - { os: windows-2022, python: '3.12' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check actual Git source archive and clean install
        if: github.event_name != 'workflow_dispatch'
        run: python scripts/source_release_gate.py --smoke
      - name: Check explicitly requested source version and clean install
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: python scripts/source_release_gate.py --smoke --expected-version "$EXPECTED_VERSION"
