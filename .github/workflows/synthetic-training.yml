name: Private synthetic audio training (CPU)

# Runs only on development PRs changing experimental model/data code.
# All checkpoints remain in process; the sole written output is an ephemeral
# metrics JSON on the runner. No actions/upload-artifact, release, cache of
# weights, trained model files, or outside dataset downloads.
on:
  pull_request:
    paths:
      - 'research/**'
      - 'src/sonumio/engines/procedural.py'
      - '.github/workflows/synthetic-training.yml'

permissions:
  contents: read

concurrency:
  group: sonumio-synthetic-training-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  extended-synthetic-training:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and CPU-only research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' 'scipy>=1.12,<2'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Train matched original linear and cosine schedule experiments
        run: |
          python -m research.schedule_ablation \
            --seeds 17,29,41 \
            --codec-steps 128 --denoiser-steps 256 \
            --schedule-steps 8 --channels 16 \
            --evaluation-combinations 21 \
            --output checkpoints/private-research/schedule-ablation.json
      - name: Validate paired protocol, all waveform checks, and zero artifacts
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          root = Path('checkpoints')
          report_path = root / 'private-research' / 'schedule-ablation.json'
          report = json.loads(report_path.read_text(encoding='utf-8'))
          assert report['protocol'] == 'paired-cosine-vs-linear-generated-audio-ablation-v1'
          assert report['paired_seeds'] == [17, 29, 41]
          assert report['shared_training_data']['evaluated_source_combinations'] == 21
          assert report['shared_training_data']['evaluated_caption_pairs'] == 84
          assert report['shared_training_data']['category_disjoint_hard_negatives']
          settings = report['shared_configuration']
          assert settings['codec_steps'] == 128
          assert settings['denoiser_steps'] == 256
          assert settings['schedule_steps'] == 8
          assert report['linear_schedule']['profile'] == 'linear_beta_v1'
          assert report['cosine_schedule']['profile'] == 'cosine_zero_terminal_v1'
          assert report['linear_schedule']['terminal_alpha_bar'] > 0.9
          assert report['cosine_schedule']['terminal_alpha_bar'] < 0.001
          assert report['model_weights_written'] is False
          assert report['generated_audio_written'] is False
          assert report['release_authorized'] is False
          assert len(report['paired_seed_metrics']) == 3
          assert {p.name for p in root.rglob('*') if p.is_file()} == {report_path.name}
          for arm in ('raw', 'latent'):
              for measure in ('clipping_fraction', 'rms',
                              'spectral_centroid_hz',
                              'rain_vs_wind_mean_absolute_difference'):
                  stat = report['paired_schedule_difference_summary'][arm][measure]
                  assert stat['count'] == 3
                  assert math.isfinite(stat['mean'])
                  print(arm, measure, 'cosine-minus-linear mean=', round(stat['mean'], 6),
                        'positive seeds=', stat['positive_runs'], '/3',
                        'negative seeds=', stat['negative_runs'], '/3')
          print('Matched schedule training complete:', report['configuration_sha256'])
          print('No neural weights, WAVs, release files or artifacts were written.')
          PY
