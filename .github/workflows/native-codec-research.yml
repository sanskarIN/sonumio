name: Native 24 kHz codec research (CPU)
on:
  pull_request:
    paths:
      - 'research/native_codec*.py'
      - 'research/crop_source_data.py'
      - 'research/weight_ema.py'
      - 'src/sonumio/engines/procedural.py'
      - 'tests/test_native_codec*.py'
      - '.github/workflows/native-codec-research.yml'
  push:
    branches: [main]
    paths:
      - 'research/native_codec*.py'
      - 'research/crop_source_data.py'
      - 'research/weight_ema.py'
      - 'src/sonumio/engines/procedural.py'
      - 'tests/test_native_codec*.py'
      - '.github/workflows/native-codec-research.yml'
permissions:
  contents: read
jobs:
  native-codec:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -e '.[test]' 'scipy>=1.12,<2'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests/test_native_codec.py tests/test_native_codec_convergence.py
      - name: Run three-seed matched native-band pilot
        run: python -m research.native_codec_study --model-seeds 17,29,41 --training-seeds 0,1,2 --validation-seeds 101,102 --updates 32 --batch-size 4
      - name: Run extended three-seed phase convergence experiment
        run: python -m research.native_codec_convergence --model-seeds 17,29,41 --training-seeds 0,1,2 --validation-seeds 201,202 --updates 128 --batch-size 4 --checkpoints 32,64,128
