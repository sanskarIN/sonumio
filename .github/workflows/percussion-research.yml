name: Learned stochastic percussion
on:
  pull_request:
    paths:
      - 'research/percussion_*.py'
      - 'research/weight_ema.py'
      - 'src/sonumio/music_instruments.py'
      - 'src/sonumio/arrangement.py'
      - 'tests/test_percussion_research.py'
      - '.github/workflows/percussion-research.yml'
  push:
    branches: [main]
    paths:
      - 'research/percussion_*.py'
      - 'research/weight_ema.py'
      - 'src/sonumio/music_instruments.py'
      - 'src/sonumio/arrangement.py'
      - 'tests/test_percussion_research.py'
      - '.github/workflows/percussion-research.yml'
permissions:
  contents: read
jobs:
  percussion:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests/test_percussion_research.py
      - name: Train and evaluate stochastic percussion
        run: |
          python -m research.percussion_study > /tmp/percussion-report.json
          python -c "import json; r=json.load(open('/tmp/percussion-report.json')); print(json.dumps({'source':r['source'],'summary':r['summary'],'training':[x['training'] for x in r['results']]}, sort_keys=True, allow_nan=False))"
