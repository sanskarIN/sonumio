name: Native music project verification
on:
  pull_request:
    paths:
      - 'src/sonumio/music_project*.py'
      - 'src/sonumio/music_score_io.py'
      - 'src/sonumio/music_automation.py'
      - 'src/sonumio/music_publish.py'
      - 'tests/test_music_project*.py'
      - '.github/workflows/music-project.yml'
  push:
    branches: [main]
    paths:
      - 'src/sonumio/music_project*.py'
      - 'src/sonumio/music_score_io.py'
      - 'src/sonumio/music_automation.py'
      - 'src/sonumio/music_publish.py'
      - 'tests/test_music_project*.py'
      - '.github/workflows/music-project.yml'
permissions:
  contents: read
jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/test_music_project.py
