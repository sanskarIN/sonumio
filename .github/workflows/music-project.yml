name: Native music project verification
on:
  pull_request:
    paths:
      - 'src/sonumio/music_project*.py'
      - 'src/sonumio/music_score_io.py'
      - 'src/sonumio/music_automation.py'
      - 'src/sonumio/music_publish.py'
      - 'tests/test_music_project*.py'
      - '.github/workflows/music-project.yml'
  push:
    branches: [main]
    paths:
      - 'src/sonumio/music_project*.py'
      - 'src/sonumio/music_score_io.py'
      - 'src/sonumio/music_automation.py'
      - 'src/sonumio/music_publish.py'
      - 'tests/test_music_project*.py'
      - '.github/workflows/music-project.yml'
# Superseded PR runs share a group and may cancel one another.
# Main-branch pushes and manual dispatches each get a unique run_id group,
# because even cancel-in-progress: false can evict older pending group runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/test_music_project.py
