name: Research tests (CPU)

on:
  pull_request:
    paths:
      - 'research/**'
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/research-ci.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and CPU research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' 'scipy>=1.12,<2'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Execute PyTorch research tests
        run: python -m pytest -q tests/test_research.py tests/test_wave_diffusion.py tests/test_audio_dataset.py tests/test_multi_condition.py tests/test_text_audio.py tests/test_latent_audio.py tests/test_latent_alignment.py
