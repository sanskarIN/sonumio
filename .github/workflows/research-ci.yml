name: Research tests (CPU)

on:
  pull_request:
    paths:
      - 'research/**'
      - 'benchmarks/**'
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/research-ci.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and CPU research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' 'scipy>=1.12,<2'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Execute PyTorch research tests
        run: python -m pytest -q tests/test_checkpoint_snapshot.py tests/test_checkpoint_archive.py tests/test_research.py tests/test_wave_diffusion.py tests/test_audio_dataset.py tests/test_multi_condition.py tests/test_text_audio.py tests/test_latent_audio.py tests/test_latent_alignment.py tests/test_latent_quality.py tests/test_architecture_compare.py tests/test_multi_seed_study.py tests/test_generation_audit.py tests/test_schedule_ablation.py tests/test_velocity_prediction.py tests/test_velocity_ddim.py tests/test_velocity_ddim_study.py tests/test_velocity_ddim_replicates.py tests/test_weight_ema.py tests/test_velocity_ema_study.py tests/test_data_reproducibility.py tests/test_dsp_pipeline_trace.py tests/test_dsp_convolution_probe.py tests/test_stable_convolution_candidate.py tests/test_full_convolution_candidate.py tests/test_complete_dsp_candidate.py tests/test_dsp_benchmark.py tests/test_candidate_reference.py tests/test_vectorized_convolution_candidate.py tests/test_fast_dsp_candidate.py tests/test_dsp_three_way.py tests/test_heldout_dsp_probe.py tests/test_numpy_stage_probe.py tests/test_numpy_ambient_probe.py tests/test_ambient_sine_candidate.py tests/test_portable_dsp_candidate.py tests/test_portable_seed_stage_probe.py tests/test_forest_sine_probe.py tests/test_portable_forest_candidate.py tests/test_portable_forest_reference.py tests/test_dsp_resource_profile.py tests/test_portable_dsp_reference.py
      - name: One-step paired velocity-DDIM research smoke (numeric JSON only)
        run: |
          python -m research.velocity_ddim_study \
            --seed 19 --train-steps 1 --codec-steps 1 \
            --schedule-steps 8 --budgets 2,8 --sample-seeds 43 \
            > /tmp/sonumio-ddim-metrics.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/sonumio-ddim-metrics.json').read_text(encoding='utf-8'))
          assert report['protocol'] == 'sonumio-velocity-sampler-budget-study-v1'
          assert report['sample_count'] == 16
          assert report['weights_written'] is False
          assert report['audio_files_written'] is False
          assert report['release_authorized'] is False
          assert all(
              report['by_arm_budget'][arm]['8']['mean_mae_to_full_step'] == 0
              for arm in ('raw', 'latent')
          )
          print('DDIM synthetic paired budget smoke: passed; no WAV/weights exported')
          PY
      - name: Two-initialization velocity-DDIM replicate smoke (numeric JSON only)
        run: |
          python -m research.velocity_ddim_replicates \
            --seeds 17,29 --train-steps 2 --codec-steps 1 \
            --schedule-steps 8 --budgets 2,8 --sample-seeds 51 \
            > /tmp/sonumio-ddim-replicates.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/sonumio-ddim-replicates.json').read_text(encoding='utf-8'))
          assert report['protocol'] == 'sonumio-replicated-velocity-ddim-study-v1'
          assert report['independent_initialization_seeds'] == 2
          assert report['configuration']['training_recordings'] == 42
          assert report['configuration']['validation_recordings'] == 42
          assert report['weight_or_audio_files_saved'] is False
          assert report['model_publication_authorized'] is False
          assert report['confidence_interval_or_significance_claimed'] is False
          assert all(
              report['within_arm_descriptive_summary'][arm]['8'][
                'mean_mae_to_full_step']['mean'] == 0
              for arm in ('raw', 'latent')
          )
          print('DDIM two-initialization paired training study passed; no model weights saved')
          PY
      - name: Original CPU velocity EMA research smoke (numeric JSON only)
        run: |
          python -m research.velocity_ema_study \
            --seed 17 --steps 2 --codec-steps 1 \
            --diffusion-steps 8 --decay 0.9 \
            --sampling-seeds 301 > /tmp/sonumio-velocity-ema.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/sonumio-velocity-ema.json').read_text(encoding='utf8'))
          assert report['protocol'] == 'sonumio-velocity-denoiser-ema-paired-study-v1'
          assert report['training']['independent_training_recordings'] == 42
          assert report['training']['independent_heldout_recordings'] == 42
          assert report['heldout_velocity_objective']['raw']['bilingual_caption_examples'] == 84
          assert report['heldout_velocity_objective']['latent']['bilingual_caption_examples'] == 84
          assert all(report['model_state_integrity'][arm]['ema_updates'] == 2
                     for arm in ('raw', 'latent'))
          assert report['no_model_weights_or_audio_saved'] is True
          assert report['model_publication_authorized'] is False
          print('Online-vs-EMA original model diagnostic passed; weights stay in memory')
          PY
      - name: Compare independently regenerated DSP recordings across Python processes
        run: |
          mkdir -p /tmp/sonumio-repro
          python -m research.data_reproducibility --output /tmp/sonumio-repro/first.json > /dev/null
          python -m research.data_reproducibility --output /tmp/sonumio-repro/repeat.json > /dev/null
          python -m research.data_reproducibility --compare /tmp/sonumio-repro/first.json /tmp/sonumio-repro/repeat.json --strict-exact --output /tmp/sonumio-repro/strict.json > /dev/null
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 python -m research.data_reproducibility --output /tmp/sonumio-repro/single-thread.json > /dev/null
          python -m research.data_reproducibility --compare /tmp/sonumio-repro/first.json /tmp/sonumio-repro/single-thread.json --output /tmp/sonumio-repro/thread-compare.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          folder = Path('/tmp/sonumio-repro')
          one = json.loads((folder / 'first.json').read_text(encoding='utf-8'))
          repeated = json.loads((folder / 'strict.json').read_text(encoding='utf-8'))
          threads = json.loads((folder / 'thread-compare.json').read_text(encoding='utf-8'))
          assert repeated['recordings_compared'] == 84
          assert repeated['exact_recording_bytes_equal']
          assert repeated['exact_dataset_fingerprints_equal']
          print('Same-environment two-process exact DSP reproducibility:', repeated['exact_recording_bytes_equal'])
          print('Training source fingerprint:', one['splits']['train']['dataset_fingerprint'])
          print('Heldout source fingerprint:', one['splits']['validation']['dataset_fingerprint'])
          for split in ('train', 'validation'):
              print(split, 'source bucket 0.001 SHA256:', one['splits'][split]['bucket_0.001_sha256'])
              print(split, 'source bucket 0.01 SHA256:', one['splits'][split]['bucket_0.01_sha256'])
          print('Research runner CPU model:', one['environment']['cpu_model'])
          print('Different threading environment exact waveform identity:', threads['exact_recording_bytes_equal'])
          print('Coarse bucket disagreement counts (0.001 and 0.01 amplitude):', threads['quantized_bucket_mismatch_counts'])
          print('Per-recording drift examples:', threads['illustrative_exact_mismatches'][:3])
          print('Coarse buckets are NOT evidence of byte identity or a bound on errors.')
          PY
      - name: Trace individual DSP operations in independently regenerated data
        run: |
          python -m research.dsp_pipeline_trace --output /tmp/sonumio-repro/pipeline-first.json > /dev/null
          python -m research.dsp_pipeline_trace --output /tmp/sonumio-repro/pipeline-repeat.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          from research.dsp_pipeline_trace import compare_traces
          p = Path('/tmp/sonumio-repro')
          first = json.loads((p / 'pipeline-first.json').read_text(encoding='utf-8'))
          again = json.loads((p / 'pipeline-repeat.json').read_text(encoding='utf-8'))
          previous = json.loads((p / 'first.json').read_text(encoding='utf-8'))
          compared = compare_traces(first, again)
          assert compared['recordings_compared'] == 84
          assert compared['exact_stage_arrays_match']
          index = {(r['split'], tuple(r['sources']), r['seed']): r for r in previous['entries']}
          for row in first['records']:
              key = (row['split'], tuple(row['sources']), row['seed'])
              assert row['stages']['cropped_8k']['sha256'] == index[key]['exact_sha256']
          print('DSP stage tracing agrees byte-for-byte with original renderer and per-record training manifest.')
          print('Separate-process pipeline stage hashes match:', compared['exact_stage_arrays_match'])
          print('Research pipeline CPU:', first['environment']['cpu_model'])
          for key, stat in first['stage_aggregate'].items():
              print('Stage exact SHA256:', key, stat['sha256'], 'count', stat['count'])
          for category, group in first['single_source_aggregate'].items():
              for key, stat in group.items():
                  if key.startswith('layer_') or key == 'cropped_8k':
                      print('Single-source stage exact SHA256:', category, key, stat['sha256'])
          PY
      - name: Run one-step raw-vs-latent research diagnostic (no saved model artifacts)
        run: python -m research.architecture_compare --codec-steps 1 --denoiser-steps 1 --evaluation-combinations 2 --seed 17
      - name: Run 3-seed controlled architecture study (JSON only, no model weights)
        run: |
          python -m research.multi_seed_study \
            --seeds 17,29,41 \
            --codec-steps 24 --denoiser-steps 48 \
            --schedule-steps 8 --evaluation-combinations 4 \
            --output checkpoints/private-research/multi-seed-ci.json
          python -c "import json; from pathlib import Path; p=Path('checkpoints/private-research/multi-seed-ci.json'); j=json.loads(p.read_text()); assert j['seed_count']==3 and not j['weights_saved'] and not j['weights_published']; print('Multiseed report validated:', j['configuration_sha256'])"

      - name: Paired in-memory DSP runtime sample (diagnostic only)
        run: |
          python -m benchmarks.dsp_candidate --case rain --repeats 2 --warmups 0             --output checkpoints/private-research/dsp-latency-ci.json > /dev/null
          python - <<'PY'
          import json, math
          from pathlib import Path
          data = json.loads(Path('checkpoints/private-research/dsp-latency-ci.json').read_text())
          assert data['protocol'] == 'sonumio-isolated-dsp-render-benchmark-v1'
          assert data['repeats'] == 2 and data['raw_frames'] == 36000
          assert not data['audio_files_saved'] and not data['model_weights_saved']
          assert not data['candidate_used_for_training']
          assert math.isfinite(data['candidate_to_legacy_median_latency_ratio'])
          print('DSP_RUNTIME_CPU:', data['environment']['cpu_model'])
          print('DSP_RUNTIME_CASE:', data['source_categories'])
          print('DSP_RUNTIME_LEGACY_MEDIAN_S:', data['legacy']['median_seconds'])
          print('DSP_RUNTIME_CANDIDATE_MEDIAN_S:', data['candidate']['median_seconds'])
          print('DSP_RUNTIME_CANDIDATE_OVER_LEGACY:', data['candidate_to_legacy_median_latency_ratio'])
          print('DSP_RUNTIME_MAX_ABS_SAMPLE_ERROR:', data['max_absolute_sample_difference'])
          print('Timing is not a release criterion; sample waveform bytes are not published.')
          PY

      - name: Paired original scalar and vectorized 24k DSP latency research
        run: |
          python -m benchmarks.dsp_three_way --case rain --seed 0             --repeats 3 --warmups 1             --output checkpoints/private-research/three-way-ci.json > /dev/null
          python - <<'PY'
          import json, math
          from pathlib import Path
          data = json.loads(Path('checkpoints/private-research/three-way-ci.json').read_text())
          assert data['protocol'] == 'sonumio-paired-three-way-dsp-benchmark-v1'
          assert data['repeats'] == 3 and data['frames_24k'] == 36000
          assert data['fast_equals_scalar_sha256']
          assert not data['candidate_used_for_neural_training']
          assert not data['audio_files_saved'] and not data['model_weights_saved']
          for name, row in data['latency'].items():
              assert len(row['sha256']) == 64
              assert 0 < row['median_seconds'] < 100
              print('THREE_WAY_MEDIAN_S:', name, row['median_seconds'])
          assert math.isfinite(data['scalar_over_fast_median_speedup'])
          print('THREE_WAY_CPU:', data['environment']['cpu_model'])
          print('THREE_WAY_SCALAR_OVER_FAST:', data['scalar_over_fast_median_speedup'])
          print('THREE_WAY_FAST_OVER_ORIGINAL:', data['fast_vs_legacy_median_latency_ratio'])
          print('THREE_WAY_SAMPLE_ERROR:', data['maximum_sample_error'])
          print('Local 24k DSP in-memory microbenchmark, NOT neural production performance.')
          PY

      - name: Independently profile five original/fast/forest DSP variants (one process each)
        run: |
          python -m benchmarks.dsp_resource_profile \
            --case thunder-forest --seed 41 --repeats 2 --warmups 1 \
            --output checkpoints/private-research/dsp-rss-profile-ci.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          from benchmarks.dsp_resource_profile import PROTOCOL, VARIANTS
          data = json.loads(Path('checkpoints/private-research/dsp-rss-profile-ci.json').read_text())
          assert data['protocol'] == PROTOCOL
          assert data['case'] == 'thunder-forest' and data['seed'] == 41
          assert data['source_frames'] == 36000 and data['repeats'] == 2
          assert set(data['variants']) == set(VARIANTS)
          assert not data['original_generator_modified']
          assert not data['original_data_modified']
          assert not data['candidate_used_for_neural_training']
          assert not data['audio_files_saved'] and not data['model_weights_saved']
          for name, row in data['variants'].items():
              assert len(row['wave_sha256']) == 64
              assert 0 < row['median_render_seconds'] < 20
              assert not row['audio_files_saved'] and not row['model_weights_saved']
              print('DSP_RESOURCE_VARIANT:', name,
                    'median_24k_render_seconds:', row['median_render_seconds'],
                    'whole_process_peak_rss_kib:', row['total_process_peak_rss_kib'])
          print('Memory includes process and imported libraries, not only DSP allocations.')
          PY
