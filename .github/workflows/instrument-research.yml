name: Learned harmonic instrument reconstruction
on:
  pull_request:
    paths:
      - 'research/instrument_*.py'
      - 'research/weight_ema.py'
      - 'src/sonumio/arrangement.py'
      - 'src/sonumio/music.py'
      - 'src/sonumio/music_instruments.py'
      - 'src/sonumio/audio.py'
      - 'tests/test_instrument_harmonic_research.py'
      - '.github/workflows/instrument-research.yml'
  push:
    branches: [main]
    paths:
      - 'research/instrument_*.py'
      - 'research/weight_ema.py'
      - 'src/sonumio/arrangement.py'
      - 'src/sonumio/music.py'
      - 'src/sonumio/music_instruments.py'
      - 'src/sonumio/audio.py'
      - 'tests/test_instrument_harmonic_research.py'
      - '.github/workflows/instrument-research.yml'
permissions:
  contents: read
jobs:
  reconstruction:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests/test_instrument_harmonic_research.py
      - name: Replicate instrument training and disjoint note reconstruction
        run: python -m research.instrument_harmonic_study --model-seeds 17,29,41 --width 48 --updates 96 --batch-size 8 --evaluation-batch-size 8
