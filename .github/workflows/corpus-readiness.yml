name: Reviewed corpus readiness (CPU)

on:
  pull_request:
    paths:
      - 'research/audio_dataset.py'
      - 'research/corpus_readiness.py'
      - 'research/corpus_archive*.py'
      - 'tests/test_corpus_archive.py'
      - 'research/dataset_manifest.py'
      - 'research/*leakage.py'
      - 'research/wave_diffusion.py'
      - 'tests/test_corpus_readiness.py'
      - 'tests/test_audio_dataset.py'
      - '.github/workflows/corpus-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'research/audio_dataset.py'
      - 'research/corpus_readiness.py'
      - 'research/corpus_archive*.py'
      - 'tests/test_corpus_archive.py'
      - 'research/dataset_manifest.py'
      - 'research/*leakage.py'
      - 'tests/test_corpus_readiness.py'
      - '.github/workflows/corpus-readiness.yml'

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU research dependencies
        run: |
          python -m pip install -e '.[test]' 'scipy>=1.12,<2'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Test verified ingestion and corpus readiness
        run: python -m pytest -q tests/test_audio_dataset.py tests/test_corpus_readiness.py tests/test_corpus_archive.py
