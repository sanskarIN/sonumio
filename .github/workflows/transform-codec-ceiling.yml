name: Transform codec ceiling (CPU)

on:
  pull_request:
    paths:
      - 'research/transform_*codec*.py'
      - 'research/transform_quantization.py'
      - 'research/quantized_transform_study.py'
      - 'research/open_set_source*.py'
      - 'research/generated_source_grounding.py'
      - 'research/latent_audio.py'
      - 'research/wave_diffusion.py'
      - 'src/sonumio/engines/procedural.py'
      - 'tests/test_transform_audio_codec.py'
      - 'tests/test_transform_quantization.py'
      - '.github/workflows/transform-codec-ceiling.yml'
  push:
    branches: [main]
    paths:
      - 'research/**'
      - 'src/sonumio/**'
      - 'tests/test_transform_audio_codec.py'
      - 'tests/test_transform_quantization.py'
      - '.github/workflows/transform-codec-ceiling.yml'

permissions:
  contents: read

jobs:
  transform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: |
          python -m pip install -e '.[test]' 'scipy>=1.12,<2'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Test transform reconstruction and evaluation isolation
        run: python -m pytest -q tests/test_transform_audio_codec.py tests/test_transform_quantization.py
      - name: Run fixed twenty-configuration scalar budget study
        run: |
          python -m research.transform_codec_study > "$RUNNER_TEMP/transform-study.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "transform-study.json").read_text())
          assert len(report["experiments"]) == 20
          assert not report["exact_split_overlap"]
          assert report["fit_only_basis_and_coordinate_selection"]
          assert not report["audio_or_weights_saved"]
          assert not report["quantized_bitrate_established"]
          print("reference gate", report["reference_gate_passed"])
          for row in report["experiments"]:
              holdout = row["probe_holdout"]
              if row["coefficients_per_frame"] == 64:
                  assert holdout["numerical"]["mse"] < 1e-12
              print(row["method"], row["coefficients_per_frame"],
                    "scalar ratio", row["scalar_compression_ratio"],
                    "holdout accepted", holdout["reconstructed_correct_accepted"],
                    "original accepted", holdout["original_correct_accepted"],
                    "mean relative squared error", holdout["numerical"]["relative_squared_error"],
                    "per-category", {k: v["reconstructed_correct_accepted"] for k, v in holdout["by_category"].items()})
          PY
      - name: Run validation-selected packed coefficient benchmark
        run: |
          python -m research.quantized_transform_study > "$RUNNER_TEMP/quantized-transform-study.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "quantized-transform-study.json").read_text())
          assert len(report["validation_candidates"]) == 60
          assert report["ranges_and_transform_fit_on_training_only"]
          assert not report["confirmation_used_for_selection"]
          assert not report["exact_split_overlap"]
          assert not report["production_bitrate_established"]
          assert not report["audio_weights_or_payload_files_saved"]
          assert report["panel_fingerprints"]["confirmation"]["recordings"] == 24
          assert set(report["confirmation"]) == {row["candidate_id"] for row in report["selection"] if row["candidate_id"] is not None}
          candidates = {row["id"]: row for row in report["validation_candidates"]}
          for row in report["selection"]:
              name = row["candidate_id"]
              assert name is not None
              validation = candidates[name]["validation"]
              confirmed = report["confirmation"][name]
              quantized = confirmed["quantized"]
              floating = confirmed["same_transform_unquantized"]
              assert quantized["payload_bits_per_second"] <= row["payload_cap_bps"]
              print("payload selection", row["payload_cap_bps"], name,
                    "actual coefficient payload bps", quantized["payload_bits_per_second"],
                    "validation accepted", validation["reconstructed_correct_accepted"],
                    "confirmation accepted", quantized["reconstructed_correct_accepted"],
                    "confirmation originals", quantized["original_correct_accepted"],
                    "unquantized confirmation accepted", floating["reconstructed_correct_accepted"],
                    "confirmation relative error", quantized["numerical"]["relative_squared_error"],
                    "saturation", quantized["quantization"]["saturated_fraction"])
          PY
