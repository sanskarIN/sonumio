name: Transform codec ceiling (CPU)

on:
  pull_request:
    paths:
      - 'research/transform_*codec*.py'
      - 'research/transform_quantization.py'
      - 'research/quantized_transform_study.py'
      - 'research/codec_noise_controls.py'
      - 'research/frozen_transform*.py'
      - 'research/velocity*.py'
      - 'research/text_audio.py'
      - 'research/open_set_source*.py'
      - 'research/generated_source_grounding.py'
      - 'research/latent_audio.py'
      - 'research/wave_diffusion.py'
      - 'src/sonumio/engines/procedural.py'
      - 'tests/test_transform_audio_codec.py'
      - 'tests/test_transform_quantization.py'
      - 'tests/test_codec_noise_controls.py'
      - 'tests/test_frozen_transform_latent.py'
      - '.github/workflows/transform-codec-ceiling.yml'
  push:
    branches: [main]
    paths:
      - 'research/**'
      - 'src/sonumio/**'
      - 'tests/test_transform_audio_codec.py'
      - 'tests/test_transform_quantization.py'
      - 'tests/test_codec_noise_controls.py'
      - 'tests/test_frozen_transform_latent.py'
      - '.github/workflows/transform-codec-ceiling.yml'

permissions:
  contents: read

jobs:
  transform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: |
          python -m pip install -e '.[test]' 'scipy>=1.12,<2'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Test transform reconstruction and evaluation isolation
        run: python -m pytest -q tests/test_transform_audio_codec.py tests/test_transform_quantization.py tests/test_frozen_transform_latent.py tests/test_codec_noise_controls.py
      - name: Run fixed twenty-configuration scalar budget study
        run: |
          python -m research.transform_codec_study > "$RUNNER_TEMP/transform-study.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "transform-study.json").read_text())
          assert len(report["experiments"]) == 20
          assert not report["exact_split_overlap"]
          assert report["fit_only_basis_and_coordinate_selection"]
          assert not report["audio_or_weights_saved"]
          assert not report["quantized_bitrate_established"]
          print("reference gate", report["reference_gate_passed"])
          for row in report["experiments"]:
              holdout = row["probe_holdout"]
              if row["coefficients_per_frame"] == 64:
                  assert holdout["numerical"]["mse"] < 1e-12
              print(row["method"], row["coefficients_per_frame"],
                    "scalar ratio", row["scalar_compression_ratio"],
                    "holdout accepted", holdout["reconstructed_correct_accepted"],
                    "original accepted", holdout["original_correct_accepted"],
                    "mean relative squared error", holdout["numerical"]["relative_squared_error"],
                    "per-category", {k: v["reconstructed_correct_accepted"] for k, v in holdout["by_category"].items()})
          PY
      - name: Run validation-selected packed coefficient benchmark
        run: |
          python -m research.quantized_transform_study > "$RUNNER_TEMP/quantized-transform-study.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "quantized-transform-study.json").read_text())
          assert len(report["validation_candidates"]) == 60
          assert report["ranges_and_transform_fit_on_training_only"]
          assert not report["confirmation_used_for_selection"]
          assert not report["exact_split_overlap"]
          assert not report["production_bitrate_established"]
          assert not report["audio_weights_or_payload_files_saved"]
          assert report["panel_fingerprints"]["confirmation"]["recordings"] == 24
          assert report["noise_panel_fingerprints"]["validation"]["recordings"] == 21
          assert report["noise_panel_fingerprints"]["confirmation"]["recordings"] == 28
          assert report["selection_uses_source_scores"] == (report["reference_gate_passed"] and report["validation_original_noise_accepted"] == 0)
          assert report["selection_uses_noise_scores"] == report["selection_uses_source_scores"]
          assert set(report["confirmation"]) == {row["candidate_id"] for row in report["selection"] if row["candidate_id"] is not None}
          candidates = {row["id"]: row for row in report["validation_candidates"]}
          for row in report["selection"]:
              name = row["candidate_id"]
              assert name is not None
              validation = candidates[name]["validation"]
              confirmed = report["confirmation"][name]
              quantized = confirmed["quantized"]
              floating = confirmed["same_transform_unquantized"]
              assert quantized["payload_bits_per_second"] <= row["payload_cap_bps"]
              print("payload selection", row["payload_cap_bps"], name,
                    "actual coefficient payload bps", quantized["payload_bits_per_second"],
                    "validation accepted", validation["reconstructed_correct_accepted"],
                    "confirmation accepted", quantized["reconstructed_correct_accepted"],
                    "confirmation originals", quantized["original_correct_accepted"],
                    "unquantized confirmation accepted", floating["reconstructed_correct_accepted"],
                    "confirmation relative error", quantized["numerical"]["relative_squared_error"],
                    "saturation", quantized["quantization"]["saturated_fraction"])
              print("noise control", name, "validation accepted", validation["noise_controls"]["reconstructed_accepted"],
                    "confirmation original", quantized["noise_controls"]["original_accepted"],
                    "confirmation quantized", quantized["noise_controls"]["reconstructed_accepted"],
                    "confirmation unquantized", floating["noise_controls"]["reconstructed_accepted"],
                    "new false acceptances", quantized["noise_controls"]["new_false_acceptances"],
                    "noise screen passed", confirmed["confirmation_noise_screen_passed"])
          PY
      - name: Gate continuous transform latent diffusion on fresh source and noise controls
        run: |
          for seed in 17 29; do
            python -m research.frozen_transform_study --seed "$seed" --train-steps 96 --evaluations 8 \
              --sampling-seeds 301 302 > "$RUNNER_TEMP/frozen-transform-$seed.json"
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          reports = [json.loads((root / f"frozen-transform-{s}.json").read_text()) for s in (17, 29)]
          assert reports[0]["selected_transform"] == reports[1]["selected_transform"]
          assert reports[0]["gate"] == reports[1]["gate"]
          for report in reports:
              assert not report["exact_cross_domain_overlap"]
              assert not report["confirmation_used_for_selection"]
              assert not report["weights_or_audio_saved"]
              assert not report["model_readiness_established"]
              print("frozen transform", report["selected_transform"], "gate", report["gate"])
              print("fresh reconstruction categories", {k: v["reconstructed_correct_accepted"] for k, v in report["confirmation"]["by_category"].items()})
              print("fresh noise controls", report["noise_confirmation"])
              print("latent statistics", json.dumps(report["codec_diagnostics"], sort_keys=True))
              if report["gate"]["passed"]:
                  assert report["status"] == "trained"
                  assert set(report["arms"]) == {"native", "calibrated"}
                  for name, arm in report["arms"].items():
                      assert len(arm["generated"]["cases"]) == 24
                      assert len(arm["generated"]["null_checks"]) == 2
                      print("generation", name, json.dumps(arm["generated"]["by_language"], sort_keys=True))
                      print("heldout", name, json.dumps(arm["heldout"], sort_keys=True))
              else:
                  assert report["status"] == "reconstruction_gate_failed" and not report["arms"]
          PY
