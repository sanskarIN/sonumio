name: Codec and latent calibration research (CPU)

on:
  pull_request:
    paths:
      - 'research/calibrated_audio_codec.py'
      - 'research/codec_calibration_study.py'
      - 'research/open_set_source*.py'
      - 'research/generated_source_grounding.py'
      - 'research/latent_audio.py'
      - 'research/text_audio.py'
      - 'research/velocity*.py'
      - 'research/wave_diffusion.py'
      - 'src/sonumio/engines/procedural.py'
      - 'tests/test_calibrated_audio_codec.py'
      - '.github/workflows/codec-latent-calibration.yml'
  push:
    branches: [main]
    paths:
      - 'research/**'
      - 'src/sonumio/**'
      - 'tests/test_calibrated_audio_codec.py'
      - '.github/workflows/codec-latent-calibration.yml'

permissions:
  contents: read

jobs:
  codec:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU research dependencies
        run: |
          python -m pip install -e '.[test]' 'scipy>=1.12,<2'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Test codec calibration and real paired inference
        run: python -m pytest -q tests/test_calibrated_audio_codec.py
      - name: Run two independent codec and denoising initializations
        run: |
          for seed in 17 29; do
            python -m research.codec_calibration_study --seed "$seed" \
              --codec-steps 64 --train-steps 64 --evaluations 8 \
              --sampling-seeds 301 302 > "$RUNNER_TEMP/codec-$seed.json"
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          reports = [json.loads((root / f"codec-{s}.json").read_text()) for s in (17, 29)]
          for report in reports:
              assert not report["exact_split_overlap"]
              assert report["same_denoiser_initialization_and_noise"]
              assert not report["weights_or_audio_saved"]
              assert not report["model_readiness_established"]
              assert report["configuration"]["scalar_compression_ratio"] == 4
              arms = report["arms"]
              assert arms["legacy_native"]["native_codec_sha256"] == arms["legacy_calibrated"]["native_codec_sha256"]
              for name, arm in arms.items():
                  print("codec", report["configuration"]["seed"], name,
                        json.dumps(arm["reconstruction"]["validation_metrics"], sort_keys=True))
                  oracle = arm["reconstruction"]["source_holdout_oracle"]
                  print("oracle", name, oracle["original_correct_accepted"],
                        oracle["reconstructed_correct_accepted"])
                  stats = arm["training_latent_statistics"]
                  print("latent moments", name, stats["maximum_absolute_channel_mean"],
                        stats["mean_absolute_channel_std_minus_one"])
                  if report["reference_probe"]["gate"]["passed"]:
                      assert len(arm["generated"]["cases"]) == 24
                      assert len(arm["generated"]["null_checks"]) == 2
                      print("generated", name, json.dumps(arm["generated"]["by_language"], sort_keys=True))
                  else:
                      assert arm["generated"] is None
              assert len({arm["denoising"]["initial_state_sha256"] for arm in arms.values()}) == 1
              assert len({arm["denoising"]["training_input_trace_sha256"] for arm in arms.values()}) == 1
          assert reports[0]["training_fingerprint"] == reports[1]["training_fingerprint"]
          assert reports[0]["validation_fingerprint"] == reports[1]["validation_fingerprint"]
          PY
