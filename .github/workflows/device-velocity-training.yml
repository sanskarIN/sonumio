name: Device-aware velocity training (CPU)

on:
  pull_request:
    paths:
      - 'research/device_velocity*.py'
      - 'research/velocity_loss_weights.py'
      - 'research/semantic_training.py'
      - 'research/counterfactual_conditioning.py'
      - 'research/velocity_prediction.py'
      - 'research/velocity_ddim.py'
      - 'research/text_audio.py'
      - 'research/latent_audio.py'
      - 'research/open_set_source_probe.py'
      - 'research/generated_source_grounding.py'
      - 'research/wave_diffusion.py'
      - 'src/sonumio/engines/procedural.py'
      - 'tests/test_device_velocity_training.py'
      - 'tests/test_velocity_loss_weights.py'
      - 'tests/test_device_sampling_policies.py'
      - 'tests/test_semantic_training.py'
      - '.github/workflows/device-velocity-training.yml'
  push:
    branches: [main]
    paths:
      - 'research/device_velocity*.py'
      - 'research/velocity_loss_weights.py'
      - 'research/semantic_training.py'
      - 'research/counterfactual_conditioning.py'
      - 'tests/test_device_velocity_training.py'
      - 'tests/test_velocity_loss_weights.py'
      - 'tests/test_device_sampling_policies.py'
      - 'tests/test_semantic_training.py'
      - '.github/workflows/device-velocity-training.yml'

permissions:
  contents: read

jobs:
  training:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU research dependencies
        run: |
          python -m pip install -e '.[test]' 'scipy>=1.12,<2'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Test logical batches, gradients and device selection
        run: python -m pytest -q -rs tests/test_device_velocity_training.py tests/test_velocity_loss_weights.py tests/test_device_sampling_policies.py tests/test_semantic_training.py
      - name: Compare two microbatch partitions with two independent initializations
        run: |
          for seed in 17 29; do
            python -m research.device_velocity_study --device cpu --seed "$seed" \
              --steps 24 --batch-size 5 --microbatch-size 5 --alternative-microbatch 2 \
              --schedule-steps 8 --evaluations 4 > "$RUNNER_TEMP/device-study-$seed.json"
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          reports = [json.loads((root / f"device-study-{s}.json").read_text()) for s in (17, 29)]
          for report in reports:
              assert report["paired_initialization_and_inputs"]
              assert not report["exact_split_overlap"]
              assert not report["cuda_training_executed"]
              assert not report["cuda_performance_or_quality_established"]
              assert not report["weights_or_audio_saved"]
              assert not report["model_readiness_established"]
              arms = report["arms"]
              assert set(arms) == {"reference_cpu", "alternative_cpu"}
              assert arms["reference_cpu"]["training"]["batch_plan"] == arms["alternative_cpu"]["training"]["batch_plan"]
              assert arms["reference_cpu"]["training"]["microbatch_backward_calls"] == 24
              assert arms["alternative_cpu"]["training"]["microbatch_backward_calls"] == 72
              print("seed", report["configuration"]["seed"], "parameter comparison", report["parameter_comparisons"])
              for name, arm in arms.items():
                  print("training", name, json.dumps(arm["training"], sort_keys=True))
                  print("heldout", name, json.dumps(arm["heldout"], sort_keys=True))
                  if report["reference_probe"]["gate"]["passed"]:
                      assert len(arm["generated"]["cases"]) == 12
                      assert arm["generated"]["null_caption_invariant"]
                      print("generated", name, json.dumps(arm["generated"]["by_language"], sort_keys=True))
                  else:
                      assert arm["generated"] is None
          assert reports[0]["training_fingerprint"] == reports[1]["training_fingerprint"]
          assert reports[0]["validation_fingerprint"] == reports[1]["validation_fingerprint"]
          PY
      - name: Compare loss weighting under fixed logical-batch inputs
        run: |
          for seed in 17 29; do
            python -m research.device_velocity_study --device cpu --seed "$seed" \
              --steps 32 --batch-size 5 --microbatch-size 2 --alternative-microbatch 1 \
              --schedule-steps 8 --evaluations 4 --compare-objectives > "$RUNNER_TEMP/objectives-$seed.json"
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          for seed in (17, 29):
              report = json.loads((root / f"objectives-{seed}.json").read_text())
              assert report["paired_initialization_and_inputs"]
              assert report["weighted_objectives_not_directly_comparable"]
              assert not report["weights_or_audio_saved"]
              arms = report["arms"]
              assert set(arms) == {"reference_cpu", "alternative_cpu", "min_snr_cpu", "clean_mse_cpu"}
              assert len({a["training"]["batch_plan"]["input_trace_sha256"] for a in arms.values()}) == 1
              assert len({a["training"]["initial_state_sha256"] for a in arms.values()}) == 1
              for name, arm in arms.items():
                  train = arm["training"]
                  assert train["mean_weighted_objective"] <= train["mean_velocity_mse"] + 1e-6
                  print("objective", seed, name, train["loss_policy"], train["timestep_weights"])
                  print("heldout unweighted", seed, name, json.dumps(arm["heldout"], sort_keys=True))
                  if report["reference_probe"]["gate"]["passed"]:
                      assert len(arm["generated"]["cases"]) == 12
                      print("generated", seed, name, json.dumps(arm["generated"]["by_language"], sort_keys=True))
          PY
      - name: Verify stratified bilingual paired training
        run: |
          python -m research.device_velocity_study --device cpu --seed 17 \
            --steps 16 --batch-size 4 --microbatch-size 3 --alternative-microbatch 1 \
            --schedule-steps 8 --evaluations 4 --timestep-sampling stratified \
            --caption-sampling bilingual_pair > "$RUNNER_TEMP/paired-sampling.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "paired-sampling.json").read_text())
          assert report["paired_initialization_and_inputs"]
          arms = report["arms"]
          assert set(arms) == {"reference_cpu", "alternative_cpu"}
          for name, arm in arms.items():
              plan = arm["training"]["batch_plan"]
              assert plan["timestep_histogram"] == [8] * 8
              assert plan["timestep_count_spread"] == 0
              assert plan["distinct_caption_rows_seen"] % 2 == 0
              assert plan["caption_sampling"] == "bilingual_pair"
              assert plan["timestep_sampling"] == "stratified"
              print("paired sampling", name, json.dumps(plan, sort_keys=True))
              print("heldout", name, json.dumps(arm["heldout"], sort_keys=True))
          assert arms["reference_cpu"]["training"]["batch_plan"] == arms["alternative_cpu"]["training"]["batch_plan"]
          PY
      - name: Compare matched-input semantic supervision
        run: |
          for seed in 17 29; do
            python -m research.device_velocity_study --device cpu --seed "$seed" \
              --steps 48 --batch-size 4 --microbatch-size 2 --alternative-microbatch 1 \
              --schedule-steps 8 --evaluations 4 --compare-semantics \
              --caption-sampling bilingual_pair --timestep-sampling stratified \
              > "$RUNNER_TEMP/semantic-study-$seed.json"
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          for seed in (17, 29):
              report = json.loads((root / f"semantic-study-{seed}.json").read_text())
              assert report["paired_initialization_and_inputs"]
              assert not report["weights_or_audio_saved"]
              arms = report["arms"]
              assert set(arms) == {"reference_cpu", "alternative_cpu", "semantic_cpu"}
              baseline = arms["reference_cpu"]["training"]
              trained = arms["semantic_cpu"]["training"]
              assert baseline["batch_plan"] == trained["batch_plan"]
              assert baseline["initial_state_sha256"] == trained["initial_state_sha256"]
              assert baseline["semantic_diagnostics"] is None
              diagnostics = trained["semantic_diagnostics"]
              assert not diagnostics["head_retained_for_inference"]
              assert diagnostics["final_validation"]["caption_rows"] == 84
              assert not diagnostics["final_validation"]["generated_audio_semantics_established"]
              print("semantic head", seed, json.dumps(diagnostics, sort_keys=True))
              for name, arm in arms.items():
                  print("heldout", seed, name, json.dumps(arm["heldout"], sort_keys=True))
                  if report["reference_probe"]["gate"]["passed"]:
                      print("generated", seed, name, json.dumps(arm["generated"]["by_language"], sort_keys=True))
          PY
