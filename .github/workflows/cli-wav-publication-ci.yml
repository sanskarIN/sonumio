name: Atomic local CLI WAV publication

on:
  pull_request:
    paths:
      - 'src/sonumio/atomic_cli_wav.py'
      - 'src/sonumio/cli.py'
      - 'tests/test_atomic_cli_wav.py'
      - 'docs/CLI_WAV_PUBLICATION.md'
      - '.github/workflows/cli-wav-publication-ci.yml'
  push:
    branches: [main]

# Superseded PR runs share a group and may cancel one another.
# Main-branch pushes and manual dispatches each get a unique run_id group,
# because even cancel-in-progress: false can evict older pending group runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  atomic-cli-output:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: '3.11' }
          - { os: ubuntu-24.04, python: '3.13' }
          - { os: windows-2022, python: '3.12' }
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and regression dependencies
        run: python -m pip install -e '.[test]'
      - name: Exercise atomic output, symlinks, collisions, digest and rollback
        run: python -m pytest -q tests/test_atomic_cli_wav.py
      - name: Preserve existing CLI and WAV behavior
        run: |
          python -m pytest -q tests/test_scenes.py tests/test_audio.py tests/test_audio_core_cli_wave_process.py
