name: Replicated neural codec objective studies (CPU)

on:
  pull_request:
    paths:
      - 'research/codec_loss_replicates.py'
      - 'tests/test_codec_loss_replicates.py'
      - '.github/workflows/codec-loss-replicates.yml'
      - 'research/codec_objectives.py'
      - 'research/codec_loss_study.py'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  codec-replicates:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install first-party CPU PyTorch codec dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' 'scipy>=1.12,<2'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Assert real model-seed replication and reject source-data forgery
        run: |
          python -m pytest -q tests/test_codec_loss_replicates.py
      - name: Retrain two independent codec initializations (numeric JSON only)
        run: |
          python -m research.codec_loss_replicates \
            --model-seeds 17,29 --updates 2 --training-batch 2 \
            --training-seeds 0 --heldout-seeds 101 \
            > /tmp/sonumio-codec-replicated-weights-unpublished.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('/tmp/sonumio-codec-replicated-weights-unpublished.json').read_text())
          assert r['protocol'] == 'sonumio-independent-neural-codec-loss-replicates-v1'
          assert r['independent_model_seed_count'] == 2
          assert r['matched_source_recordings_across_seeds'] is True
          assert r['source_recording_groups_and_bilingual_duplicates_validated'] is True
          assert r['independent_initial_model_weight_hashes_verified'] is True
          assert r['independent_final_model_weight_hashes_verified'] is True
          assert r['model_seeds_not_caption_or_audio_sampling_seeds_are_replicates'] is True
          assert r['perceptual_or_open_domain_quality_claim'] is False
          assert r['statistical_significance_or_model_winner_declared'] is False
          assert r['no_weights_or_audio_written'] is True
          assert r['model_publication_authorized'] is False
          for entry in r['replicated_model_training_runs']:
              assert len(entry['model_initial_sha256']) == 64
              assert len(entry['trained_model_sha256']['original_loss']) == 64
              assert len(entry['trained_model_sha256']['multiresolution_loss']) == 64
          print('Two independently initialized neural codec objective runs validated; no weights')
          PY
