name: Symbolic arrangement assembly verification
on:
  pull_request:
    paths:
      - 'src/sonumio/music_assembly*.py'
      - 'src/sonumio/arrangement.py'
      - 'src/sonumio/music_score_io.py'
      - 'tests/test_music_assembly.py'
      - '.github/workflows/music-assembly.yml'
  push:
    branches: [main]
    paths:
      - 'src/sonumio/music_assembly*.py'
      - 'src/sonumio/arrangement.py'
      - 'src/sonumio/music_score_io.py'
      - 'tests/test_music_assembly.py'
      - '.github/workflows/music-assembly.yml'
permissions:
  contents: read
jobs:
  assembly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/test_music_assembly.py
