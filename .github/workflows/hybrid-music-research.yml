name: Hybrid learned music reconstruction
on:
  pull_request:
    paths:
      - 'research/hybrid_music*.py'
      - 'research/instrument_*.py'
      - 'research/weight_ema.py'
      - 'src/sonumio/arrangement.py'
      - 'src/sonumio/music*.py'
      - 'src/sonumio/audio.py'
      - 'tests/test_hybrid_music_research.py'
      - '.github/workflows/hybrid-music-research.yml'
  push:
    branches: [main]
    paths:
      - 'research/hybrid_music*.py'
      - 'research/instrument_*.py'
      - 'research/weight_ema.py'
      - 'src/sonumio/arrangement.py'
      - 'src/sonumio/music*.py'
      - 'src/sonumio/audio.py'
      - 'tests/test_hybrid_music_research.py'
      - '.github/workflows/hybrid-music-research.yml'
permissions:
  contents: read
jobs:
  reconstruction:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests/test_hybrid_music_research.py tests/test_music_instruments_mix.py
      - name: Train and evaluate full score reconstruction
        run: |
          python -m research.hybrid_music_study > /tmp/hybrid-music-report.json
          python -c "import json; r=json.load(open('/tmp/hybrid-music-report.json')); print(json.dumps({'score_cases':r['score_cases'],'replicate_summary':r['replicate_summary'],'coverage':[x['coverage'] for x in r['replicates'][0]['cases']]}, sort_keys=True, allow_nan=False))"
