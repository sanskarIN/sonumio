name: Private generated replication screen (CPU)
on:
  pull_request:
    paths:
      - 'research/archive_replication_*.py'
      - 'research/archive_generated_assay.py'
      - 'research/archive_signal_reference.py'
      - 'research/archive_checkpoint*.py'
      - 'research/archive_readiness.py'
      - 'research/corpus_archive*.py'
      - 'tests/test_archive_replication_*.py'
      - 'tests/test_archive_generated_assay.py'
      - 'tests/test_archive_training.py'
      - '.github/workflows/archive-replication-research.yml'
  push:
    branches: [main]
    paths:
      - 'research/archive_replication_*.py'
      - 'research/archive_generated_assay.py'
      - 'research/archive_signal_reference.py'
      - 'research/archive_checkpoint*.py'
      - 'research/archive_readiness.py'
      - 'research/corpus_archive*.py'
      - 'tests/test_archive_replication_*.py'
      - 'tests/test_archive_generated_assay.py'
      - 'tests/test_archive_training.py'
      - '.github/workflows/archive-replication-research.yml'
permissions:
  contents: read
jobs:
  replication:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -e '.[test]' 'scipy>=1.12,<2'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests/test_archive_replication_screen.py tests/test_archive_replication_controls.py tests/test_archive_generated_assay.py
