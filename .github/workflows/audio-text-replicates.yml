name: Independent bilingual audio-text model replication (CPU)

on:
  pull_request:
    paths:
      - 'research/audio_text_alignment_replicates.py'
      - 'tests/test_audio_text_alignment_replicates.py'
      - '.github/workflows/audio-text-replicates.yml'
      - 'research/audio_text_alignment_study.py'
      - 'research/audio_text_alignment.py'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  alignment-replicates:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original CPU neural text/audio research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' 'scipy>=1.12,<2'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Reject forged bilingual neural retrieval and invalid model-seed evidence
        run: |
          python -m pytest -q tests/test_audio_text_alignment_replicates.py
      - name: Independently train two original English/Hindi alignment models
        run: |
          python -m research.audio_text_alignment_replicates \
            --model-seeds 17,29 --updates 2 --batch-categories 4 \
            --training-seeds 0 --validation-seeds 101 \
            > /tmp/sonumio-contrastive-model-replicates.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('/tmp/sonumio-contrastive-model-replicates.json').read_text(encoding='utf8'))
          assert r['protocol'] == 'sonumio-replicated-bilingual-audio-text-alignment-v1'
          assert r['independent_model_initializations'] == 2
          assert len(r['real_independent_model_training_runs']) == 2
          assert r['source_sha256_and_heldout_candidate_panel_matched_across_runs'] is True
          assert r['unique_initial_and_final_model_sha256_validated'] is True
          assert r['category_disjoint_info_nce_false_negatives_rejected'] is True
          assert r['one_heldout_recording_per_category_and_language_verified'] is True
          assert r['same_audio_used_for_english_and_hindi_retrieval'] is True
          assert r['distinct_caption_tokens_not_extra_audio_recordings'] is True
          assert r['statistical_significance_or_open_vocabulary_semantics_established'] is False
          assert r['human_listening_or_audio_generation_quality_established'] is False
          assert r['no_audio_embeddings_or_model_weights_written'] is True
          assert r['model_publication_authorized'] is False
          for row in r['real_independent_model_training_runs']:
              for lang in ('english', 'hindi', 'wrong_label_cyclic_shift'):
                  metric = row['per_language_retrieval'][lang]
                  assert 0 <= metric['recall_at_1'] <= 1
                  assert 0 <= metric['recall_at_5'] <= 1
          print('Two independently initialized bilingual alignment networks validated; no artifacts')
          PY
