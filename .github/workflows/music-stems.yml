name: Verified original music stems
on:
  pull_request:
    paths:
      - 'src/sonumio/music*.py'
      - 'src/sonumio/arrangement*.py'
      - 'src/sonumio/audio.py'
      - 'src/sonumio/atomic_cli_wav.py'
      - 'src/sonumio/cli.py'
      - 'src/sonumio/_file_identity.py'
      - 'src/sonumio/audio_core/**'
      - 'tests/test_music_stem_pack.py'
      - '.github/workflows/music-stems.yml'
  push:
    branches: [main]
    paths:
      - 'src/sonumio/music*.py'
      - 'src/sonumio/arrangement*.py'
      - 'src/sonumio/audio.py'
      - 'src/sonumio/atomic_cli_wav.py'
      - 'src/sonumio/cli.py'
      - 'src/sonumio/_file_identity.py'
      - 'src/sonumio/audio_core/**'
      - 'tests/test_music_stem_pack.py'
      - '.github/workflows/music-stems.yml'
# Superseded PR runs share a group and may cancel one another.
# Main-branch pushes and manual dispatches each get a unique run_id group,
# because even cancel-in-progress: false can evict older pending group runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  stems:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/test_music_stem_pack.py tests/test_music_interchange.py
